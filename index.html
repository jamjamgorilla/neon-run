<!DOCTYPE html>
<!-- Neon Run: an endless rooftop runner through a rainy neon city. Jump, double jump and slide; it keeps speeding up. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Neon Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #07040a; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// ============================================================================================
// Neon Run. Everything is in this one file: drawing, sounds (made in code) and saving.
// The world is 1000 x 600 "units"; the screen scales it to fit.
// ============================================================================================

// --- Tuning ---
const VIEW_H = 600;
const GRAVITY = 2700;
const JUMP_V = 980;            // first jump: about 178 units high
const DOUBLE_V = 840;          // double jump: about 130 more
const JUMP_CUT = 0.5;          // let go early for a shorter hop
const FAST_FALL = 2200;        // pressing down in the air
const COYOTE = 0.1;            // you can still jump just after running off an edge
const BUFFER = 0.12;           // a jump pressed just before landing still counts
const SPEED_START = 400;
const SPEED_MAX = 980;
const SPEED_RAMP = 3.2;        // units per second, every second
const PLAYER_X = 240;          // where the runner stays on screen
const STAND_H = 62, SLIDE_H = 30, PLAYER_W = 30;
const SLIDE_TIME = 0.75;

const RED = "#ff2e4d", HOT = "#ff6a3d", PINK = "#ff4fa3", CYAN = "#3ff0ff", GOLD = "#ffd36b";
const FONT = "Bahnschrift, 'Segoe UI', Arial, sans-serif";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let scale = 1, viewW = 1000;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  scale = canvas.height / VIEW_H;
  viewW = canvas.width / scale;
}
addEventListener("resize", resize);
resize();

// --- Saving the best score (this browser only) ---
function loadBest() {
  try { return Number(localStorage.getItem("neonrun_best") || 0); } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem("neonrun_best", String(v)); } catch (e) { /* private window: just don't save */ }
}

// --- Sounds, made with the Web Audio API (browsers only allow them after the first key or tap) ---
let audio = null, muted = false;
function initAudio() {
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
function beep(f0, f1, dur, type = "square", vol = 0.12, noise = false) {
  if (!audio || muted) return;
  const t = audio.currentTime;
  const g = audio.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  g.connect(audio.destination);
  if (noise) {
    const len = Math.floor(audio.sampleRate * dur);
    const buf = audio.createBuffer(1, len, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audio.createBufferSource();
    src.buffer = buf;
    const filter = audio.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.setValueAtTime(f0, t);
    filter.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    src.connect(filter).connect(g);
    src.start(t);
    return;
  }
  const o = audio.createOscillator();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  o.connect(g);
  o.start(t);
  o.stop(t + dur);
}
const sfx = {
  jump: () => beep(320, 640, 0.12, "square", 0.08),
  double: () => beep(520, 1100, 0.15, "triangle", 0.14),
  land: () => beep(900, 120, 0.08, "square", 0.05, true),
  slide: () => beep(2400, 300, 0.25, "square", 0.08, true),
  spark: () => { beep(1320, 1320, 0.05, "square", 0.05); setTimeout(() => beep(1760, 1760, 0.09, "square", 0.05), 45); },
  power: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.12, "triangle", 0.12), i * 60)),
  close: () => beep(700, 1400, 0.1, "triangle", 0.07),
  shield: () => beep(200, 900, 0.3, "sine", 0.2),
  crash: () => { beep(3000, 60, 0.5, "square", 0.22, true); beep(240, 40, 0.5, "sawtooth", 0.12); },
};

// --- Particles ---
let particles = [];
function burst(x, y, color, n = 12, speed = 300, life = 0.5, size = 3, grav = 600) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, size, grav });
  }
}

// --- The world: rooftops with things on them ---
let roofs, things, sparks, powerups;
let genX, lastTop;
let state, player, speed, dist, score, sparkCount, best, shake, time, slowMo, popups, flash;

function jumpDistance(v) {             // how far a full single jump carries you at speed v
  return (2 * JUMP_V / GRAVITY) * v;
}

// Builds the next rooftop and decides what goes on it. Gaps and steps are always beatable at the current speed.
function generate() {
  const v = speed;
  const progress = Math.min(1, (v - SPEED_START) / (SPEED_MAX - SPEED_START));
  const single = jumpDistance(v);
  // gap: early ones are easy single jumps, later ones sometimes need the double jump
  let gap = 0;
  if (roofs.length > 0) {
    const maxGap = Math.random() < 0.15 + progress * 0.35 ? single * 1.08 : single * 0.62;   // the long ones need a double jump
    gap = 80 + Math.random() * Math.max(0, maxGap - 80);
  }
  // height: steps up are capped well below what one jump can reach
  let top = lastTop + (Math.random() * 2 - 1) * 110;
  if (top < lastTop - 110) top = lastTop - 110;               // never a step up of more than 110
  top = Math.max(300, Math.min(500, top));
  const width = 700 + Math.random() * 900 * (1 - progress * 0.4) + v * 0.6;
  const x = genX + gap;
  const roof = { x, w: width, top, hue: Math.random(), seed: Math.random() * 1000, windows: [] };
  for (let i = 0; i < 18; i++) roof.windows.push([Math.random(), Math.random(), Math.random() < 0.4]);
  roofs.push(roof);

  // obstacles, spaced so there's always time to react
  const minSpace = Math.max(260, v * 0.75);
  // the first obstacle goes past where you land from the gap jump, plus time to react
  const landing = gap > 0 ? Math.max(0, single * 1.25 - gap) : 0;
  let ox = x + landing + v * 0.55 + 120 + Math.random() * 120;
  while (ox < x + width - 160) {
    const r = Math.random();
    const allowHard = progress > 0.15;
    if (r < 0.3) {
      things.push({ kind: "barrier", x: ox, w: 28, h: 38 + Math.random() * 22, roof, passed: false });
    } else if (r < 0.5 && allowHard) {
      things.push({ kind: "bar", x: ox, w: 90 + Math.random() * 60, gapH: 42, roof, passed: false });
    } else if (r < 0.68) {
      things.push({ kind: "spikes", x: ox, w: 60 + Math.random() * 70 * (0.5 + progress), h: 20, roof, passed: false });
    } else if (r < 0.82 && allowHard) {
      things.push({ kind: "drone", x: ox, w: 46, h: 22, hover: 40 + Math.random() * 14, roof, phase: Math.random() * 6, passed: false });
    } else {
      // a little arc of sparks to collect
      const n = 5;
      for (let i = 0; i < n; i++) {
        sparks.push({ x: ox + i * 34, y: top - 40 - Math.sin(i / (n - 1) * Math.PI) * 90, got: false });
      }
    }
    if (Math.random() < 0.05 + progress * 0.04) {
      powerups.push({ x: ox + minSpace * 0.5, y: top - 110, kind: Math.random() < 0.5 ? "shield" : "magnet", got: false });
    }
    ox += minSpace + Math.random() * minSpace * (1.2 - progress * 0.5);
  }
  // sparks arc over gaps too, showing the way
  if (gap > 120) {
    for (let i = 1; i < 5; i++) {
      const fx = genX + gap * i / 5;
      sparks.push({ x: fx, y: Math.min(lastTop, top) - 70 - Math.sin(i / 5 * Math.PI) * 70, got: false });
    }
  }
  genX = x + width;
  lastTop = top;
}

function reset() {
  roofs = []; things = []; sparks = []; powerups = []; particles = []; popups = [];
  speed = SPEED_START; dist = 0; score = 0; sparkCount = 0; time = 0; shake = 0; slowMo = 0; flash = 0;
  genX = -400; lastTop = 430;
  generate();
  roofs[0].x = -400; roofs[0].w = 1500; roofs[0].top = 430;     // a long, empty first roof to get going
  things = []; sparks = []; powerups = [];
  genX = roofs[0].x + roofs[0].w;
  lastTop = 430;
  player = { y: 430, vy: 0, onGround: true, coyote: 0, buffer: 0, doubleUsed: false, slide: 0, holdJump: false,
             shield: 0, magnet: 0, squash: 1, trail: [], runPhase: 0, dead: false };
  best = loadBest();
}

// --- Input ---
const input = { jumpHeld: false, downHeld: false };
function pressJump() {
  initAudio();
  if (state === "title" || state === "over") {
    if (state === "over" && time < 0.6) return;      // don't skip the game-over screen by accident
    startRun();
    return;
  }
  if (state === "paused") { state = "play"; return; }
  input.jumpHeld = true;
  player.buffer = BUFFER;
}
function releaseJump() {
  input.jumpHeld = false;
  if (player && player.vy < 0 && !player.cutDone) { player.vy *= JUMP_CUT; player.cutDone = true; }
}
function pressDown() {
  initAudio();
  input.downHeld = true;
  if (state !== "play") return;
  if (player.onGround && player.slide <= 0) { player.slide = SLIDE_TIME; sfx.slide(); }
}
function releaseDown() { input.downHeld = false; }

addEventListener("keydown", e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if ([" ", "arrowup", "w", "z"].includes(k)) { pressJump(); e.preventDefault(); }
  else if (["arrowdown", "s", "x", "shift"].includes(k)) { pressDown(); e.preventDefault(); }
  else if (k === "m") muted = !muted;
  else if ((k === "p" || k === "escape") && (state === "play" || state === "paused")) state = state === "play" ? "paused" : "play";
});
addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if ([" ", "arrowup", "w", "z"].includes(k)) releaseJump();
  if (["arrowdown", "s", "x", "shift"].includes(k)) releaseDown();
});
// touch and mouse: tap to jump, swipe down to slide
let touchStartY = null;
canvas.addEventListener("pointerdown", e => { touchStartY = e.clientY; pressJump(); });
canvas.addEventListener("pointermove", e => {
  if (touchStartY !== null && e.clientY - touchStartY > 40) { touchStartY = null; releaseJump(); pressDown(); setTimeout(releaseDown, 300); }
});
addEventListener("pointerup", () => { touchStartY = null; releaseJump(); });
addEventListener("blur", () => { if (state === "play") state = "paused"; });

function startRun() {
  reset();
  state = "play";
}

// --- Game logic, run at a fixed 120 steps per second ---
function roofAt(x) {
  for (const r of roofs) if (x >= r.x && x <= r.x + r.w) return r;
  return null;
}
function playerBox() {
  const h = player.slide > 0 ? SLIDE_H : STAND_H;
  return { l: PLAYER_X - PLAYER_W / 2 + 4, r: PLAYER_X + PLAYER_W / 2 - 4, t: player.y - h + 4, b: player.y - 2 };
}
function thingBox(t) {
  const sx = t.x - dist;
  const top = t.roof.top;
  if (t.kind === "barrier") return { l: sx + 3, r: sx + t.w - 3, t: top - t.h + 4, b: top };
  if (t.kind === "spikes") return { l: sx + 6, r: sx + t.w - 6, t: top - t.h + 8, b: top };
  if (t.kind === "bar") return { l: sx, r: sx + t.w, t: top - t.gapH - 400, b: top - t.gapH };
  if (t.kind === "drone") {
    const y = top - t.hover + Math.sin(t.phase) * 5;
    return { l: sx + 4, r: sx + t.w - 4, t: y - t.h / 2 + 3, b: y + t.h / 2 - 3 };
  }
}
function overlap(a, b) { return a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t; }

function die(reason) {
  if (player.shield > 0) {
    player.shield = 0;
    sfx.shield();
    burst(PLAYER_X, player.y - 30, CYAN, 30, 420, 0.6, 4);
    shake = 10;
    flash = 0.5;
    popups.push({ text: "SHIELD BROKE", x: PLAYER_X, y: player.y - 90, life: 1.1, color: CYAN });
    return false;
  }
  player.dead = true;
  state = "over";
  time = 0;
  sfx.crash();
  shake = 22;
  flash = 1;
  burst(PLAYER_X, player.y - 30, RED, 50, 600, 0.9, 4, 900);
  burst(PLAYER_X, player.y - 30, "#ffffff", 20, 300, 0.5, 3, 900);
  const final = Math.floor(score);
  if (final > best) { best = final; saveBest(best); player.newBest = true; }
  player.deathReason = reason;
  return true;
}

function step(dt) {
  if (state !== "play") {
    time += dt;
    updateParticles(dt);
    return;
  }
  time += dt;
  const slow = slowMo > 0 ? 0.55 : 1;
  slowMo = Math.max(0, slowMo - dt);
  const sdt = dt * slow;
  speed = Math.min(SPEED_MAX, speed + SPEED_RAMP * sdt);
  dist += speed * sdt;
  score += speed * sdt * 0.05;

  while (genX - dist < viewW + 1600) generate();
  roofs = roofs.filter(r => r.x + r.w - dist > -500);
  things = things.filter(t => t.x + 300 - dist > -200);
  sparks = sparks.filter(s => !s.got && s.x - dist > -100);
  powerups = powerups.filter(p => !p.got && p.x - dist > -100);

  const p = player;
  // gravity, jumping and landing
  p.buffer -= sdt;
  p.coyote = p.onGround ? COYOTE : p.coyote - sdt;
  if (p.buffer > 0) {
    if (p.onGround || p.coyote > 0) {
      p.vy = -JUMP_V; p.onGround = false; p.coyote = 0; p.buffer = 0; p.cutDone = false; p.slide = 0;
      p.squash = 1.35; sfx.jump();
      burst(PLAYER_X, p.y, "#ffb3c0", 6, 160, 0.3, 2, 400);
    } else if (!p.doubleUsed) {
      p.vy = -DOUBLE_V; p.doubleUsed = true; p.buffer = 0; p.cutDone = false;
      p.squash = 1.3; sfx.double();
      burst(PLAYER_X, p.y - 10, PINK, 14, 260, 0.4, 3, 0);
    }
  }
  if (!p.onGround) {
    p.vy += GRAVITY * sdt + (input.downHeld ? FAST_FALL * sdt : 0);
    if (p.vy > 0) p.cutDone = true;
  }
  const prevY = p.y;
  p.y += p.vy * sdt;
  const under = roofAt(dist + PLAYER_X);
  const underL = roofAt(dist + PLAYER_X - PLAYER_W / 2 + 6);
  const underR = roofAt(dist + PLAYER_X + PLAYER_W / 2 - 6);
  const support = under || underR || underL;
  if (p.onGround) {
    if (!support) { p.onGround = false; p.vy = 0; }
    else if (support.top < p.y - 2) {
      // ran into the side of a taller roof
      if (die("hit a wall")) return;
      p.y = support.top;
    } else p.y = support.top;
  } else if (support && p.vy >= 0 && prevY <= support.top + 1 && p.y >= support.top) {
    p.y = support.top; p.onGround = true; p.doubleUsed = false;
    const impact = p.vy;
    p.vy = 0;
    p.squash = 0.65;
    if (impact > 500) { sfx.land(); burst(PLAYER_X, p.y, "#ff9aa8", 8, 180, 0.35, 2, 500); }
    if (p.buffer > 0) p.buffer = Math.max(p.buffer, 0.001);
  }
  // crashing into the face of a roof while falling past its edge
  const ahead = roofAt(dist + PLAYER_X + PLAYER_W / 2 - 4);
  if (!p.onGround && ahead && p.y > ahead.top + 6 && prevY > ahead.top + 6) {
    if (die("hit a wall")) return;
    p.y = ahead.top; p.vy = 0; p.onGround = true;
  }
  if (p.y > VIEW_H + 120) { player.shield = 0; die("fell"); return; }

  // sliding
  if (p.slide > 0) {
    p.slide -= sdt;
    if (!p.onGround) p.slide = 0;
    if (p.slide <= 0 && input.downHeld && p.onGround) p.slide = 0.15;   // keep sliding while held
  }
  p.squash += (1 - p.squash) * Math.min(1, sdt * 12);
  p.runPhase += sdt * speed * 0.035;
  p.shield = Math.max(0, p.shield - sdt);
  p.magnet = Math.max(0, p.magnet - sdt);

  // obstacles and close calls
  const box = playerBox();
  for (const t of things) {
    if (t.kind === "drone") t.phase += sdt * 4;
    const tb = thingBox(t);
    if (overlap(box, tb)) {
      if (die("hit " + (t.kind === "bar" ? "a bar" : t.kind === "drone" ? "a drone" : t.kind === "spikes" ? "spikes" : "a barrier"))) return;
      t.passed = true;
      t.hit = true;
    }
    if (!t.passed && tb.r < box.l) {
      t.passed = true;
      // how close was it?
      const near = t.kind === "bar" || t.kind === "drone" ? Math.abs(tb.b - box.t) : Math.abs(box.b - tb.t);
      if (!t.hit && near < 16) {
        score += 50;
        sfx.close();
        popups.push({ text: "CLOSE CALL +50", x: PLAYER_X + 40, y: p.y - 90, life: 0.9, color: GOLD });
      }
    }
  }
  // sparks and power-ups
  const cx = dist + PLAYER_X, cy = p.y - (p.slide > 0 ? SLIDE_H : STAND_H) / 2;
  for (const s of sparks) {
    if (s.got) continue;
    const dx = s.x - cx, dy = s.y - cy;
    if (p.magnet > 0 && Math.hypot(dx, dy) < 260) { s.x -= dx * Math.min(1, sdt * 9); s.y -= dy * Math.min(1, sdt * 9); }
    if (Math.abs(dx) < 26 && Math.abs(dy) < 40) {
      s.got = true; sparkCount++; score += 10; sfx.spark();
      burst(s.x - dist, s.y, GOLD, 6, 140, 0.3, 2, 0);
    }
  }
  for (const pu of powerups) {
    if (pu.got) continue;
    if (Math.abs(pu.x - cx) < 30 && Math.abs(pu.y - cy) < 50) {
      pu.got = true;
      sfx.power();
      if (pu.kind === "shield") p.shield = 12; else p.magnet = 10;
      popups.push({ text: pu.kind === "shield" ? "SHIELD" : "SPARK MAGNET", x: PLAYER_X, y: p.y - 100, life: 1.2, color: CYAN });
      burst(pu.x - dist, pu.y, CYAN, 20, 260, 0.5, 3, 0);
    }
  }
  // trail
  p.trail.push({ x: PLAYER_X, y: p.y - (p.slide > 0 ? 14 : 32), life: 0.25 });
  for (const t of p.trail) t.life -= sdt;
  p.trail = p.trail.filter(t => t.life > 0);
  for (const pp of popups) { pp.life -= sdt; pp.y -= 40 * sdt; }
  popups = popups.filter(pp => pp.life > 0);
  shake = Math.max(0, shake - sdt * 40);
  flash = Math.max(0, flash - sdt * 2.5);
  updateParticles(sdt);
}

function updateParticles(dt) {
  for (const q of particles) {
    q.life -= dt; q.vy += q.grav * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }
  particles = particles.filter(q => q.life > 0);
}

// --- Drawing ---
const rain = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), l: 10 + Math.random() * 18, s: 0.6 + Math.random() * 0.6 }));
const skyline = [0.12, 0.25, 0.45].map((factor, li) => {
  const blocks = [];
  let x = 0;
  while (x < 4000) {
    const w = 60 + Math.random() * 140;
    blocks.push({ x, w, h: 120 + Math.random() * (180 + li * 60), lit: Math.random(), sign: Math.random() < 0.12 });
    x += w + Math.random() * 30;
  }
  return { factor, blocks, li };
});

function glowRect(x, y, w, h, color, blur) {
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.shadowBlur = 0;
}

function drawBackground(t) {
  const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  sky.addColorStop(0, "#0a0410");
  sky.addColorStop(0.6, "#1d0716");
  sky.addColorStop(1, "#3a0a18");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, viewW, VIEW_H);
  // moon
  const mx = viewW * 0.78, my = 110;
  const glow = ctx.createRadialGradient(mx, my, 10, mx, my, 160);
  glow.addColorStop(0, "rgba(255,90,110,0.35)");
  glow.addColorStop(1, "rgba(255,90,110,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(mx - 160, my - 160, 320, 320);
  ctx.fillStyle = "#ffd0d6";
  ctx.beginPath(); ctx.arc(mx, my, 38, 0, Math.PI * 2); ctx.fill();
  // skyline layers
  for (const layer of skyline) {
    const off = (dist * layer.factor) % 4000;
    const shade = [14, 22, 30][layer.li];
    for (let rep = 0; rep < 2; rep++) {
      for (const b of layer.blocks) {
        const x = b.x - off + rep * 4000;
        if (x > viewW || x + b.w < 0) continue;
        const y = VIEW_H - b.h - 60 + layer.li * 40;
        ctx.fillStyle = `rgb(${shade + 6},${shade - 6},${shade + 4})`;
        ctx.fillRect(x, y, b.w, VIEW_H - y);
        // lit windows
        ctx.fillStyle = layer.li === 2 ? "rgba(255,170,120,0.35)" : "rgba(255,120,140,0.18)";
        for (let wy = y + 12; wy < VIEW_H - 40; wy += 18) {
          for (let wx = x + 8; wx < x + b.w - 8; wx += 14) {
            if (((wx * 7 + wy * 13 + b.x) | 0) % 5 === 0) ctx.fillRect(wx, wy, 5, 7);
          }
        }
        if (b.sign) {
          const on = Math.sin(t * 3 + b.x) > -0.7 || Math.random() < 0.02 ? 1 : 0.15;
          ctx.globalAlpha = on;
          glowRect(x + b.w * 0.2, y + 20, b.w * 0.6, 10, b.x % 2 > 1 ? PINK : CYAN, 18);
          ctx.globalAlpha = 1;
        }
      }
    }
  }
}

function drawRoof(r) {
  const x = r.x - dist;
  if (x > viewW + 20 || x + r.w < -20) return;
  ctx.fillStyle = "#120a10";
  ctx.fillRect(x, r.top, r.w, VIEW_H - r.top);
  // windows on the building face
  for (const [wx, wy, on] of r.windows) {
    ctx.fillStyle = on ? "rgba(255,110,90,0.5)" : "rgba(60,30,40,0.6)";
    ctx.fillRect(x + 20 + wx * (r.w - 40), r.top + 40 + wy * (VIEW_H - r.top - 50), 10, 14);
  }
  // glowing edge on top
  glowRect(x, r.top - 2, r.w, 4, RED, 22);
  ctx.fillStyle = "#2a1018";
  ctx.fillRect(x, r.top + 2, r.w, 6);
  // little rooftop details: vents and antennas
  ctx.fillStyle = "#1c0f15";
  for (let i = 0; i < r.w / 300; i++) {
    const vx = x + 80 + ((r.seed * (i + 1) * 37) % (r.w - 160));
    if (things.some(t => t.roof === r && Math.abs(t.x - dist - vx) < 120)) continue;
    ctx.fillRect(vx, r.top - 18, 34, 18);
  }
}

function drawThing(t) {
  const b = thingBox(t);
  if (b.r < -50 || b.l > viewW + 50) return;
  const sx = t.x - dist, top = t.roof.top;
  if (t.kind === "barrier") {
    ctx.fillStyle = "#2a0d16";
    ctx.fillRect(sx, top - t.h, t.w, t.h);
    glowRect(sx, top - t.h, t.w, 4, HOT, 16);
    ctx.fillStyle = HOT;
    for (let y = top - t.h + 10; y < top - 4; y += 12) ctx.fillRect(sx + 4, y, t.w - 8, 3);
  } else if (t.kind === "spikes") {
    ctx.shadowColor = RED; ctx.shadowBlur = 14;
    ctx.fillStyle = RED;
    for (let x = sx; x < sx + t.w - 4; x += 14) {
      ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x + 7, top - t.h); ctx.lineTo(x + 14, top); ctx.fill();
    }
    ctx.shadowBlur = 0;
  } else if (t.kind === "bar") {
    const y = top - t.gapH;
    ctx.fillStyle = "#1e0b13";
    ctx.fillRect(sx + 6, y - 120, 8, 120);
    ctx.fillRect(sx + t.w - 14, y - 120, 8, 120);
    glowRect(sx, y - 14, t.w, 14, PINK, 24);
    ctx.fillStyle = "#ffe0ee";
    ctx.fillRect(sx + 4, y - 9, t.w - 8, 3);
  } else if (t.kind === "drone") {
    const y = top - t.hover + Math.sin(t.phase) * 5;
    ctx.fillStyle = "#1c1016";
    ctx.fillRect(sx, y - 8, t.w, 16);
    glowRect(sx + t.w / 2 - 5, y - 4, 10, 8, RED, 18);
    const spin = Math.sin(time * 60) * 10;
    ctx.fillStyle = "rgba(255,220,230,0.6)";
    ctx.fillRect(sx - 4 + spin * 0.2, y - 14, 18, 2);
    ctx.fillRect(sx + t.w - 14 - spin * 0.2, y - 14, 18, 2);
    // a warning beam down to the roof
    ctx.fillStyle = "rgba(255,46,77,0.08)";
    ctx.fillRect(sx + t.w / 2 - 6, y + 8, 12, top - y - 8);
  }
}

function drawPlayer() {
  const p = player;
  if (p.dead) return;
  // trail
  for (const t of p.trail) {
    ctx.globalAlpha = t.life * 2;
    ctx.fillStyle = RED;
    ctx.fillRect(t.x - 4 - (0.25 - t.life) * speed * 0.6, t.y - 3, 8, 6);
  }
  ctx.globalAlpha = 1;
  const sliding = p.slide > 0;
  const h = (sliding ? SLIDE_H : STAND_H) * p.squash;
  const w = (sliding ? 46 : PLAYER_W) / Math.sqrt(p.squash);
  const x = PLAYER_X - w / 2, y = p.y - h;
  ctx.shadowColor = "#ff3355";
  ctx.shadowBlur = 26;
  ctx.fillStyle = "#ffe7ea";
  if (sliding) {
    ctx.fillRect(x, y, w, h);
  } else {
    // a simple runner: head, body and swinging legs
    const s = Math.sin(p.runPhase) * (p.onGround ? 1 : 0.3);
    ctx.beginPath(); ctx.arc(PLAYER_X + 2, y + 10, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(PLAYER_X - 8, y + 20, 16, h * 0.42);
    ctx.save();
    ctx.translate(PLAYER_X, y + 20 + h * 0.42);
    for (const dir of [1, -1]) {
      ctx.save(); ctx.rotate(s * 0.7 * dir); ctx.fillRect(-4, 0, 8, h * 0.3); ctx.restore();
    }
    ctx.restore();
  }
  ctx.shadowBlur = 0;
  // visor
  if (!sliding) { ctx.fillStyle = RED; ctx.fillRect(PLAYER_X + 3, y + 7, 9, 4); }
  if (p.shield > 0) {
    ctx.strokeStyle = `rgba(63,240,255,${p.shield < 2 ? (Math.sin(time * 20) > 0 ? 0.9 : 0.2) : 0.8})`;
    ctx.lineWidth = 3;
    ctx.shadowColor = CYAN; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(PLAYER_X, p.y - h / 2, 46, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawPickups() {
  for (const s of sparks) {
    const x = s.x - dist;
    if (x < -20 || x > viewW + 20) continue;
    const pulse = 1 + Math.sin(time * 8 + s.x) * 0.15;
    ctx.save(); ctx.translate(x, s.y); ctx.rotate(Math.PI / 4); ctx.scale(pulse, pulse);
    ctx.shadowColor = GOLD; ctx.shadowBlur = 16; ctx.fillStyle = GOLD;
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore(); ctx.shadowBlur = 0;
  }
  for (const pu of powerups) {
    const x = pu.x - dist;
    if (x < -30 || x > viewW + 30) continue;
    const y = pu.y + Math.sin(time * 3) * 6;
    ctx.shadowColor = CYAN; ctx.shadowBlur = 24;
    ctx.strokeStyle = CYAN; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 18, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = CYAN;
    ctx.font = `bold 18px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(pu.kind === "shield" ? "S" : "M", x, y + 1);
    ctx.shadowBlur = 0;
  }
}

function drawRain() {
  ctx.strokeStyle = "rgba(255,170,190,0.18)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const r of rain) {
    r.y += r.s * 0.02;
    r.x -= (speed / 1000) * 0.012 * r.s;
    if (r.y > 1) { r.y -= 1; r.x = Math.random(); }
    if (r.x < 0) r.x += 1;
    const x = r.x * viewW, y = r.y * VIEW_H;
    ctx.moveTo(x, y); ctx.lineTo(x - 4, y + r.l);
  }
  ctx.stroke();
  // speed lines when it gets fast
  const fast = (speed - 650) / 300;
  if (fast > 0 && state === "play") {
    ctx.strokeStyle = `rgba(255,220,230,${Math.min(0.25, fast * 0.25)})`;
    ctx.beginPath();
    for (let i = 0; i < 14; i++) {
      const y = (i * 97 + time * 1300) % VIEW_H, x = (i * 331 + time * 2600) % viewW;
      ctx.moveTo(viewW - x, y); ctx.lineTo(viewW - x + 120, y);
    }
    ctx.stroke();
  }
}

function text(str, x, y, size, color, align = "center", bold = true, glow = 0) {
  ctx.font = `${bold ? "bold " : ""}${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}

function drawHud() {
  if (state === "play" || state === "paused") {
    text(String(Math.floor(score)), 28, 40, 36, "#fff1f3", "left", true, 14);
    text(`BEST ${best}`, 28, 74, 16, "#d9aab3", "left", false);
    text(`${sparkCount}`, viewW - 52, 40, 26, GOLD, "right", true, 10);
    ctx.save(); ctx.translate(viewW - 34, 40); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = GOLD; ctx.fillRect(-7, -7, 14, 14); ctx.restore();
    let y = 74;
    for (const [label, left, color] of [["SHIELD", player.shield, CYAN], ["MAGNET", player.magnet, CYAN]]) {
      if (left > 0) {
        text(`${label} ${Math.ceil(left)}`, viewW - 28, y, 15, color, "right", true);
        y += 22;
      }
    }
  }
  for (const pp of popups) {
    ctx.globalAlpha = Math.min(1, pp.life * 2);
    text(pp.text, pp.x, pp.y, 18, pp.color, "center", true, 10);
  }
  ctx.globalAlpha = 1;
}

function drawOverlay(t) {
  const cx = viewW / 2;
  if (state === "title") {
    ctx.fillStyle = "rgba(5,2,8,0.55)";
    ctx.fillRect(0, 0, viewW, VIEW_H);
    text("NEON RUN", cx, 190, 96, "#ff3b5c", "center", true, 40);
    text("an endless rooftop run", cx, 250, 20, "#e4b7bf", "center", false);
    text(`BEST ${best}`, cx, 300, 22, GOLD, "center", true, 8);
    const blink = Math.sin(t * 4) > -0.3;
    if (blink) text("Press Space or tap to run", cx, 370, 26, "#fff1f3", "center", true, 12);
    text("Jump: Space / W / Up / tap      Jump again in the air: double jump      Hold for higher", cx, 440, 16, "#d9aab3", "center", false);
    text("Slide: S / Down / swipe down      M: sound      P: pause", cx, 466, 16, "#d9aab3", "center", false);
  } else if (state === "over") {
    ctx.fillStyle = `rgba(5,2,8,${Math.min(0.7, time * 1.5)})`;
    ctx.fillRect(0, 0, viewW, VIEW_H);
    text("YOU CRASHED", cx, 180, 72, "#ff3b5c", "center", true, 30);
    text(player.deathReason === "fell" ? "You fell between the buildings" : `You ${player.deathReason}`, cx, 232, 20, "#e4b7bf", "center", false);
    text(`SCORE ${Math.floor(score)}`, cx, 300, 40, "#fff1f3", "center", true, 12);
    text(player.newBest ? "NEW BEST!" : `BEST ${best}`, cx, 348, 24, GOLD, "center", true, player.newBest ? 16 : 0);
    text(`Sparks ${sparkCount}      Distance ${Math.floor(dist / 10)} m`, cx, 390, 18, "#d9aab3", "center", false);
    if (time > 0.6 && Math.sin(t * 4) > -0.3) text("Press Space or tap to run again", cx, 450, 24, "#fff1f3", "center", true, 10);
  } else if (state === "paused") {
    ctx.fillStyle = "rgba(5,2,8,0.6)";
    ctx.fillRect(0, 0, viewW, VIEW_H);
    text("PAUSED", cx, 260, 64, "#ff3b5c", "center", true, 24);
    text("Press P or Space to keep running", cx, 330, 20, "#fff1f3", "center", false);
  }
}

function draw(t) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground(t);
  for (const r of roofs) drawRoof(r);
  drawPickups();
  for (const th of things) drawThing(th);
  drawPlayer();
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life / q.max);
    ctx.fillStyle = q.color;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
  drawRain();
  if (flash > 0) { ctx.fillStyle = `rgba(255,60,90,${flash * 0.35})`; ctx.fillRect(-50, -50, viewW + 100, VIEW_H + 100); }
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawHud();
  drawOverlay(t);
}

// --- Main loop ---
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  acc += dt;
  while (acc >= STEP) { step(STEP); acc -= STEP; }
  draw(now / 1000);
  requestAnimationFrame(frame);
}
reset();
state = "title";
requestAnimationFrame(frame);
</script>
</body>
</html>
